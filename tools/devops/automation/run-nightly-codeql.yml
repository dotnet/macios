# xamarin-macios-nightly-codeql

trigger: none
pr: none

schedules:
- cron: "0 5 * * *"
  displayName: Run daily at 5:00 UTC
  branches:
    include:
    - main

stages:
- stage: build_nightly
  displayName: CodeQL
  dependsOn: []
  jobs:
  - job: build_nightly_codeql
    displayName: CodeQL
    timeoutInMinutes: 180
    variables:
      # CodeQL analyzes the source code without building it, so this job needs neither Xcode nor a Mac.
      #
      # Building under CodeQL doesn't work on our Macs: on Apple silicon CodeQL runs the traced build
      # as x86_64 (using Rosetta 2), and the Xcode we use is arm64 only. CodeQL only supports macOS 26
      # with Xcode 27 in build mode 'none'.
      #
      # All the languages below support build mode 'none'. Swift doesn't (it needs a traced build), so
      # it's not analyzed.
      Codeql.BuildMode: none
      Codeql.Language: csharp,cpp,powershell,actions,python,javascript
    pool:
      vmImage: ubuntu-latest
    steps:
    - checkout: self
      fetchTags: false
      submodules: recursive

    - task: CodeQL3000Init@0
      displayName: CodeQL 3000 Init

    - task: CodeQL3000Finalize@0
      displayName: CodeQL 3000 Finalize
