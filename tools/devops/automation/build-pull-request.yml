# Diagnostic-only PR: replace the normal builds with one official workload installation on Linux.

trigger: none

pr:
  autoCancel: true
  branches:
    include:
    - '*'

pool:
  vmImage: ubuntu-latest

jobs:
- job: linux_ios_workload
  displayName: 'Diagnose .NET 11 RC 2 iOS workload installation on Linux'
  timeoutInMinutes: 20
  steps:
  - checkout: self
    fetchDepth: 1
    fetchTags: false
    submodules: false
    persistCredentials: false

  - task: Bash@3
    displayName: 'Install official .NET 11 RC 2 SDK and iOS workload'
    inputs:
      targetType: filePath
      filePath: tools/devops/automation/scripts/diagnose-linux-ios-workload.sh
    env:
      DIAGNOSTIC_DIRECTORY: $(Agent.TempDirectory)/linux-ios-workload

  - task: PublishPipelineArtifact@1
    displayName: 'Publish workload installation diagnostics'
    condition: always()
    inputs:
      targetPath: $(Agent.TempDirectory)/linux-ios-workload/logs
      artifact: linux-ios-workload-diagnostics
