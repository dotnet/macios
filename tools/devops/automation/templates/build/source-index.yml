parameters:
  - name: repositoryAlias
    type: string
    default: self

  - name: commit
    type: string
    default: HEAD

  - name: xcodeChannel
    type: string

steps:
  - template: sdk-unified/steps/checkout/v1.yml@yaml-templates
    parameters:
      resource: ${{ parameters.repositoryAlias }}
      commit: ${{ parameters.commit }}
      clean: true
      submodules: recursive
      path: s
      fetchTags: false
      retryCount: 3

  - template: ../common/provision-xcode.yml
    parameters:
      repositoryPath: $(System.DefaultWorkingDirectory)
      xcodeChannel: ${{ parameters.xcodeChannel }}

  - ${{ if contains(variables['Build.DefinitionName'], 'private') }}:
      - task: PowerShell@2
        displayName: Setup Private Feeds Credentials
        inputs:
          filePath: $(System.DefaultWorkingDirectory)/eng/common/SetupNugetSources.ps1
          arguments: -ConfigFile $(System.DefaultWorkingDirectory)/NuGet.config******
        env:
          Token: $(dn-bot-dnceng-artifact-feeds-rw)

      - bash: |
          set -x
          set -e
          ARGS="--azure-feed \"https://dotnetclimsrc.blob.core.windows.net/dotnet\" -FeedCredential $CREDENTIALS"
          echo "##vso[task.setvariable variable=DOTNET_INSTALL_EXTRA_ARGS]$ARGS"
        env:
          CREDENTIALS: $(dotnetclimsrc-read-sas-token)
        displayName: "Configure install extra args"
        timeoutInMinutes: 5

  - bash: |
      set -eo pipefail
      set -x

      ARGS=()
      XCODE_PATH=$(xcode-select -p 2>/dev/null || true)
      if [[ -n "$XCODE_PATH" && -d "$XCODE_PATH" ]]; then
        ARGS+=("--xcode=$XCODE_PATH")
      fi

      ./configure "${ARGS[@]}"
    displayName: "Configure source index build"
    workingDirectory: $(System.DefaultWorkingDirectory)
    timeoutInMinutes: 5

  - bash: |
      set -ex
      time make reset
    displayName: 'Reset source index dependencies'
    workingDirectory: $(System.DefaultWorkingDirectory)
    timeoutInMinutes: 10
    env:
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)
