# YAML pipeline for post build operations.
# This pipeline will build the workloads and then execute the tests for the CI on a PR.

trigger: none

# Disabled for the Linux workload diagnostic PR.
pr: none

extends:
  template: templates/pipelines/run-tests-pipeline.yml
  parameters:
    isPR: true
    buildPackages: true
    useACES: true  # flip to false to opt PR simulator tests out of ACES; see templates/variables/common.yml
