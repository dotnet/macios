# Job that will download the other artifact from the tests job and will publish them in the 
# vsdrops

###########################################################
# WARNING WARNING WARNING WARNING WARNING WARNING WARNING #
###########################################################

# This job is executed on WINDOWS! make sure you DO NOT USE
# bash or linux file paths on scripts. Another important
# details is that System.DefaultWorkingDirectory
# on mac os x points on the top dir while on windows 
# is the checked out dir

parameters:

- name: statusContext
  type: string 
  default: 'iOS Device Tests' # default context, since we started dealing with iOS devices. 

- name: vsdropsPrefix
  type: string

- name: isPR
  type: boolean

- name: repositoryAlias
  type: string
  default: self

- name: commit
  type: string
  default: HEAD

- name: uploadPrefix
  type: string
  default: '$(MaciosUploadPrefix)'


steps:

- template: ../common/checkout.yml
  parameters:
    isPR: ${{ parameters.isPR }}
    repositoryAlias: ${{ parameters.repositoryAlias }}
    commit: ${{ parameters.commit }}

- template: download-artifacts.yml

- pwsh: '& "$Env:SYSTEM_DEFAULTWORKINGDIRECTORY/$Env:BUILD_REPOSITORY_TITLE/tools/devops/automation/scripts/show_bot_info.ps1"'
  displayName: 'Show Bot Info'

# build a message with all the content of all tests, to do so, we get the labels and to pass them to pwsh we do a join with ;
# as the separator
- pwsh: |
      try {
        gci env: | format-table -autosize | Out-String -Width 8192

        $vsdropsIndex="$Env:VSDROPSPREFIX/$Env:BUILD_BUILDNUMBER/$Env:BUILD_BUILDID/"
        Import-Module $Env:SYSTEM_DEFAULTWORKINGDIRECTORY\$Env:BUILD_REPOSITORY_TITLE\tools\devops\automation\scripts\MaciosCI.psd1
        $DebugPreference = "Continue" # enable debug messages

        $parallelResults = New-ParallelTestsResults `
          -Path "$Env:SYSTEM_DEFAULTWORKINGDIRECTORY\Reports" `
          -StageDependencies "$Env:STAGE_DEPENDENCIES" `
          -UploadPrefix "${{  parameters.uploadPrefix }}" `
          -Context "$Env:CONTEXT" `
          -VSDropsIndex $vsdropsIndex

        $success = $parallelResults.IsSuccess()
        $emoji = ":rocket:"
        if (-not $success) {
          Set-PipelineResult -Status partiallySucceeded
          $emoji = ":fire:"
        }

        $gihubComments = New-GitHubCommentsObjectFromUrl -Url "$(Build.Repository.Uri)" -Token $Env:GITHUB_TOKEN -Hash $Env:COMMENT_HASH -Debug
        $result = $gihubComments.NewCommentFromObject("Test results", $emoji, $parallelResults, "test results")
      } catch {
        Write-Host "##vso[task.complete result=Failed;]Failed to compute test summaries: $_"
        New-GitHubComment -Header "Failed to compute test summaries on $Env:CONTEXT" -Emoji ":fire:" -Description "Failed to compute test summaries: $_."
      }
  env:
    DEPENDENCIES: $(DEPENDENCIES)
    STAGE_DEPENDENCIES: $(STAGE_DEPENDENCIES)
    CONTEXT: ${{ parameters.statusContext }}
    GITHUB_TOKEN: $(GitHub.Token)
    TESTS_JOBSTATUS: $(TESTS_JOBSTATUS) # set by the runTests step
    TESTS_SUMMARY: $(TEST_SUMMARY_PATH)
    ACCESSTOKEN: $(System.AccessToken)
    IS_PR: ${{ parameters.isPR }}
    ${{ if eq(parameters.repositoryAlias, 'self') }}:
      COMMENT_HASH: $(fix_commit.GIT_HASH)
    ${{ else }}:
      COMMENT_HASH: $(Build.SourceVersion)
  displayName: 'Add summaries'
  continueOnError: true
  condition: always()
  timeoutInMinutes: 15

# Download the updated expected app size files that the various test jobs may have produced.
# Each test job publishes its own platform's files as a separate artifact; we download them
# all here so we can aggregate them into a single gist + PR comment below.
- task: DownloadPipelineArtifact@2
  displayName: Download updated expected app size files
  continueOnError: true
  inputs:
    patterns: "**/updated-expected-sizes-*/**"
    allowFailedBuilds: true
    path: $(System.DefaultWorkingDirectory)\updated-expected-sizes

# Create a single GitHub gist with all the updated expected files (across all platforms) and
# post a single PR comment so that a maintainer can apply the update for every platform at once
# by commenting '/apply-gist <url>'. This reuses the gist and comment helpers from our PowerShell
# module (the 'gh' CLI isn't installed on the test agents, and doesn't have credentials to create gists).
- pwsh: |
    $updatedDir = Join-Path "$Env:SYSTEM_DEFAULTWORKINGDIRECTORY" "updated-expected-sizes"
    # The expected files can be very big, so the test uploads a unified diff (a '*.txt.diff' file) for each
    # changed expected file instead of the entire file. The '/apply-gist' command applies these diffs.
    # A file may be present in more than one artifact (e.g. across job attempts); pick the newest copy per file name.
    $files = Get-ChildItem -Path $updatedDir -Filter "*.diff" -File -Recurse -ErrorAction SilentlyContinue |
      Sort-Object -Property LastWriteTimeUtc -Descending |
      Group-Object -Property Name |
      ForEach-Object { $_.Group[0] } |
      Sort-Object -Property Name
    if (-not $files) {
      Write-Host "No updated expected app size files found."
      exit 0
    }

    Import-Module $Env:SYSTEM_DEFAULTWORKINGDIRECTORY\$Env:BUILD_REPOSITORY_TITLE\tools\devops\automation\scripts\MaciosCI.psd1

    # Create a gist with all the updated files.
    $gistFiles = @()
    foreach ($file in $files) {
      $gistFiles += New-GistObjectDefinition -Name $file.Name -Path $file.FullName -Type "text"
    }
    $gistUrl = New-GistWithFiles -Description "Updated expected app size files for build $Env:BUILD_BUILDNUMBER" -Files $gistFiles
    Write-Host "Created gist: $gistUrl"

    # Build the comment body.
    $sb = [System.Text.StringBuilder]::new()
    $sb.AppendLine("### :warning: AppSizeTest expected files changed :warning:") | Out-Null
    $sb.AppendLine() | Out-Null
    $sb.AppendLine("The AppSizeTest detected changes in the expected app size files.") | Out-Null
    $sb.AppendLine() | Out-Null
    $sb.AppendLine("To update the expected files, add a comment with the following command:") | Out-Null
    $sb.AppendLine() | Out-Null
    $sb.AppendLine('```') | Out-Null
    $sb.AppendLine("/apply-gist $gistUrl") | Out-Null
    $sb.AppendLine('```') | Out-Null
    $sb.AppendLine() | Out-Null
    $sb.AppendLine("<details>") | Out-Null
    $sb.AppendLine("<summary>Updated files</summary>") | Out-Null
    $sb.AppendLine() | Out-Null
    foreach ($file in $files) {
      $sb.AppendLine("- ``$($file.Name -replace '\.diff$', '')``") | Out-Null
    }
    $sb.AppendLine() | Out-Null
    $sb.AppendLine("</details>") | Out-Null

    # Post a comment on the PR.
    $githubComments = New-GitHubCommentsObjectFromUrl -Url "$(Build.Repository.Uri)" -Token $Env:GITHUB_TOKEN -Hash $Env:COMMENT_HASH
    $githubComments.NewCommentFromMessage("", ":warning:", $sb.ToString(), "app-size-expected-files") | Out-Null
  displayName: 'Create gist and comment on PR with updated expected app size files'
  continueOnError: true
  condition: and(succeededOrFailed(), eq(${{ parameters.isPR }}, true))
  timeoutInMinutes: 15
  env:
    GITHUB_TOKEN: $(GitHub.Token)
    ${{ if eq(parameters.repositoryAlias, 'self') }}:
      COMMENT_HASH: $(fix_commit.GIT_HASH)
    ${{ else }}:
      COMMENT_HASH: $(Build.SourceVersion)
