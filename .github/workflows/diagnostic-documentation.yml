name: Diagnostic documentation
on:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Check diagnostic documentation
        run: bash docs/update-diagnostic-docs.sh check
      - name: Test diagnostic documentation workflow
        run: dotnet test scripts/diagnostic-docs/tests/diagnostic-docs.tests.csproj --nologo
