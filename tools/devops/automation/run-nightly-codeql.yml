# xamarin-macios-nightly-codeql

trigger: none
pr: none

schedules:
- cron: "0 5 * * *"
  displayName: Run daily at 5:00 UTC
  branches:
    include:
    - main

parameters:
- name: CodeQLSourceBranch
  displayName: Branch to run CodeQL on (only change this to test changes to this pipeline)
  type: string
  default: refs/heads/main

stages:
- stage: build_nightly
  displayName: CodeQL
  dependsOn: []
  jobs:
  - job: build_nightly_codeql
    displayName: CodeQL
    timeoutInMinutes: 180
    variables:
      # CodeQL analyzes the source code without building it, so this job needs neither Xcode nor a Mac.
      #
      # Building under CodeQL doesn't work on our Macs: on Apple silicon CodeQL runs the traced build
      # as x86_64 (using Rosetta 2), and the Xcode we use is arm64 only. CodeQL only supports macOS 26
      # with Xcode 27 in build mode 'none'.
      #
      # All the languages below support build mode 'none'. Swift doesn't (it needs a traced build), so
      # it's not analyzed.
      Codeql.BuildMode: none
      Codeql.Language: csharp,cpp,powershell,actions,python,javascript
    pool:
      vmImage: ubuntu-latest
    steps:
    - checkout: self
      fetchTags: false
      submodules: recursive

    # CodeQL only runs on the branch in the CodeQLSourceBranch parameter (main by default). Nothing else
    # stops it from running on other branches: CodeQL 3000 only warns that this can file duplicate bugs,
    # and the 1ES templates treat every branch of a GitHub repository as its default branch, because
    # they can't look up the default branch. See https://dev.azure.com/mseng/1ES/_workitems/edit/2479329
    - task: CodeQL3000Init@0
      displayName: CodeQL 3000 Init
      condition: and(succeeded(), eq(variables['Build.SourceBranch'], '${{ parameters.CodeQLSourceBranch }}'))

    - task: CodeQL3000Finalize@0
      displayName: CodeQL 3000 Finalize
      condition: and(succeeded(), eq(variables['Build.SourceBranch'], '${{ parameters.CodeQLSourceBranch }}'))
